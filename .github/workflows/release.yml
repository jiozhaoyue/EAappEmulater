name: Release EAappEmulater

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 6 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Restore
        run: dotnet restore EAappEmulater.sln

      - name: Build
        run: dotnet build EAappEmulater.sln -c Release --no-restore

      - name: Publish (framework-dependent single-file EXE)
        run: dotnet publish EAappEmulater/EAappEmulater.csproj ^
              -c Release ^
              -r win-x64 ^
              --self-contained false ^
              -p:PublishSingleFile=true ^
              -p:IncludeNativeLibrariesForSelfExtract=true ^
              -p:DebugType=None ^
              -p:DebugSymbols=false ^
              -o publish/EAappEmulater-win-x64

      - name: Rename to EADesktop.exe and clean folder
        shell: pwsh
        run: |
          Set-Location "publish/EAappEmulater-win-x64"

          $exe = Get-ChildItem -Filter *.exe | Select-Object -First 1

          if (-not $exe) {
            Write-Error "No .exe file found in publish output."
            exit 1
          }

          if ($exe.Name -ne "EADesktop.exe") {
            Rename-Item $exe.Name "EADesktop.exe"
          }

          Get-ChildItem | Where-Object { $_.Name -ne "EADesktop.exe" } | Remove-Item -Force

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress

      - name: Build Installer (Inno Setup)
        shell: pwsh
        run: |
          $rawVersion = "${{ github.ref_name }}"
          if ($rawVersion.StartsWith("v")) {
            $version = $rawVersion.Substring(1)
          } else {
            $version = $rawVersion
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = "1.9.1.5"
          }
          Write-Host "Building installer with version: $version"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion="$version" installer/EAappEmulater.iss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: EAappEmulater ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            publish/EAappEmulater-win-x64/EADesktop.exe
            installer_output/EAappEmulater-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
